<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050d">
<meta name="color-scheme" content="dark">
<title>Baby Sleep Music 🌙</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌙%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#04050d;
    background-image:radial-gradient(120% 90% at 50% 0%,#151b40 0%,#0a0d24 45%,#04050d 100%);
    color:#c9d2ee;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    text-align:center;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
  }
  main{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:2rem 1.25rem;width:100%;max-width:30rem}
  .moon{font-size:3.4rem;line-height:1;text-shadow:0 0 36px rgba(150,170,255,.35)}
  h1{font-size:1.25rem;font-weight:500;letter-spacing:.04em;color:#dde4fb}
  .track a{color:#8fa0e8;text-decoration:none;font-size:.95rem}
  .track a:hover{text-decoration:underline}
  #status{font-size:.85rem;color:#78829f;min-height:1.2em}
  #status.playing{color:#9fd6a9}
  button{
    font:inherit;color:#c9d2ee;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);border-radius:999px;
    padding:.55rem 1.4rem;cursor:pointer;font-size:.95rem;
  }
  button:hover{background:rgba(255,255,255,.1)}
  #startBtn{padding:.7rem 2.2rem;background:rgba(143,160,232,.14);border-color:rgba(143,160,232,.35)}
  #errorBtn{background:rgba(143,160,232,.14);border-color:rgba(143,160,232,.35)}
  .controls{display:flex;flex-direction:column;align-items:center;gap:.85rem;margin-top:.3rem}
  .transport{display:flex;gap:.6rem}
  .volume{display:flex;align-items:center;gap:.6rem;font-size:.8rem;color:#78829f;cursor:default}
  input[type=range]{accent-color:#8fa0e8;width:min(11rem,58vw)}
  .credit{font-size:.72rem;color:#5a6280;margin-top:.5rem;line-height:1.6}
  .credit a{color:#78829f}
  [hidden]{display:none!important}
  body.sleep-mode{background:#020308;background-image:none;cursor:none}
  body.sleep-mode main>:not(.moon){display:none}
  body.sleep-mode main{gap:0}
  body.sleep-mode .moon{opacity:.15;text-shadow:none;font-size:2.6rem}
  .hint{
    position:fixed;bottom:1.4rem;left:0;right:0;
    font-size:.75rem;color:#4a5270;pointer-events:none;
    animation:hintFade 5s ease forwards;
  }
  @keyframes hintFade{0%{opacity:0}20%{opacity:1}70%{opacity:1}100%{opacity:0}}
  #sc-player{position:fixed;left:0;bottom:0;width:100%;height:166px;border:0;opacity:0;pointer-events:none}
</style>
</head>
<body>
<main>
  <div class="moon" aria-hidden="true">🌙</div>
  <h1>Baby Sleep Music</h1>
  <p class="track"><a href="https://soundcloud.com/zahraazreik/sleep-instantly-within-3" target="_blank" rel="noopener">♪ Sleep Instantly Within…</a></p>
  <p id="status">Loading sleep music…</p>
  <button id="startBtn" hidden>Start Music</button>
  <div class="controls" id="controls" hidden>
    <div class="transport">
      <button id="playBtn">▶ Play</button>
      <button id="pauseBtn">⏸ Pause</button>
    </div>
    <label class="volume">Volume <input type="range" id="volume" min="0" max="100" value="75" aria-label="Volume"></label>
    <button id="wakeBtn">Keep Screen Awake: Off</button>
    <button id="sleepBtn">🌙 Sleep Mode</button>
  </div>
  <button id="errorBtn" hidden onclick="window.open('https://soundcloud.com/zahraazreik/sleep-instantly-within-3','_blank','noopener')">Open on SoundCloud</button>
  <p class="credit">
    “Sleep Instantly Within…” by Zahraa Azreik<br>
    <a href="https://soundcloud.com/zahraazreik/sleep-instantly-within-3" target="_blank" rel="noopener">Listen on SoundCloud</a>
  </p>
</main>

<iframe
  id="sc-player"
  title="SoundCloud player"
  width="100%"
  height="166"
  scrolling="no"
  frameborder="no"
  allow="autoplay"
  src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fzahraazreik%2Fsleep-instantly-within-3&amp;auto_play=true&amp;hide_related=true&amp;show_comments=false&amp;show_user=false&amp;show_reposts=false&amp;show_teaser=false&amp;visual=false">
</iframe>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
(function () {
  "use strict";

  var els = {
    status:   document.getElementById("status"),
    startBtn: document.getElementById("startBtn"),
    controls: document.getElementById("controls"),
    playBtn:  document.getElementById("playBtn"),
    pauseBtn: document.getElementById("pauseBtn"),
    volume:   document.getElementById("volume"),
    wakeBtn:  document.getElementById("wakeBtn"),
    sleepBtn: document.getElementById("sleepBtn"),
    errorBtn: document.getElementById("errorBtn")
  };

  var widget = null;
  var ready = false;
  var hasPlayed = false;
  var legacyBrowser = false;
  try { new Function("async () => { var x = (a?.b) ?? 1; }"); }
  catch (e) { legacyBrowser = true; }
  var sleepEnteredAt = 0;
  var wakeLock = null;
  var wakeEnabled = false;

  function store(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }
  function read(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  function updatePlaybackStatus(text, isPlaying) {
    els.status.textContent = text;
    els.status.classList.toggle("playing", !!isPlaying);
  }

  function showError() {
    els.startBtn.hidden = true;
    els.controls.hidden = true;
    els.errorBtn.hidden = false;
    updatePlaybackStatus(
      legacyBrowser
        ? "This device's software is too old for the SoundCloud player."
        : "Unable to load the music.",
      false
    );
  }

  function initializePlayer() {
    widget = SC.Widget(document.getElementById("sc-player"));

    widget.bind(SC.Widget.Events.READY, function () {
      ready = true;
      applyVolume();
      attemptAutoplay();
    });

    widget.bind(SC.Widget.Events.PLAY, function () {
      hasPlayed = true;
      els.startBtn.hidden = true;
      els.errorBtn.hidden = true;
      els.controls.hidden = false;
      updatePlaybackStatus("● Playing", true);
    });

    widget.bind(SC.Widget.Events.PAUSE, function () {
      updatePlaybackStatus("○ Paused", false);
    });

    widget.bind(SC.Widget.Events.FINISH, handleTrackFinished);
    widget.bind(SC.Widget.Events.ERROR, showError);

    setTimeout(function () {
      if (!ready) { showError(); }
    }, legacyBrowser ? 7000 : 12000);
  }

  function attemptAutoplay() {
    updatePlaybackStatus("Waiting for interaction", false);
    widget.play();
    setTimeout(function () {
      if (hasPlayed) { return; }
      widget.isPaused(function (paused) {
        if (paused && !hasPlayed) {
          els.startBtn.hidden = false;
        }
      });
    }, 1500);
  }

  function startPlayback() {
    if (widget) { widget.play(); }
  }

  function pausePlayback() {
    if (widget) { widget.pause(); }
  }

  function handleTrackFinished() {
    widget.seekTo(0);
    widget.play();
  }

  function applyVolume() {
    if (ready && widget) {
      widget.setVolume(Number(els.volume.value));
    }
  }

  function onVolumeChange() {
    applyVolume();
    store("volume", els.volume.value);
  }

  function enableSleepMode() {
    document.body.classList.add("sleep-mode");
    store("sleepMode", "true");
    sleepEnteredAt = Date.now();
    var hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "tap anywhere to wake";
    document.body.appendChild(hint);
    setTimeout(function () { hint.remove(); }, 5200);
  }

  function disableSleepMode() {
    document.body.classList.remove("sleep-mode");
    store("sleepMode", "false");
    var hint = document.querySelector(".hint");
    if (hint) { hint.remove(); }
  }

  function requestWakeLock() {
    if (!("wakeLock" in navigator)) { return; }
    navigator.wakeLock.request("screen").then(function (lock) {
      wakeLock = lock;
      wakeLock.addEventListener("release", function () { wakeLock = null; });
    }).catch(function () {});
  }

  function setKeepAwake(on) {
    wakeEnabled = on;
    els.wakeBtn.textContent = "Keep Screen Awake: " + (on ? "On" : "Off");
    if (on) {
      requestWakeLock();
    } else if (wakeLock) {
      try { wakeLock.release(); } catch (e) {}
      wakeLock = null;
    }
  }

  els.playBtn.addEventListener("click", startPlayback);
  els.pauseBtn.addEventListener("click", pausePlayback);
  els.startBtn.addEventListener("click", startPlayback);
  els.volume.addEventListener("input", onVolumeChange);
  els.volume.addEventListener("change", onVolumeChange);
  els.wakeBtn.addEventListener("click", function () {
    setKeepAwake(!wakeEnabled);
  });
  els.sleepBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    enableSleepMode();
  });

  document.addEventListener("click", function () {
    if (document.body.classList.contains("sleep-mode") && Date.now() - sleepEnteredAt > 600) {
      disableSleepMode();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { disableSleepMode(); }
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && wakeEnabled && !wakeLock) {
      requestWakeLock();
    }
  });

  var savedVolume = read("volume");
  if (savedVolume !== null) { els.volume.value = savedVolume; }

  if (read("sleepMode") === "true") {
    document.body.classList.add("sleep-mode");
    sleepEnteredAt = Date.now();
  }

  if (window.SC) {
    initializePlayer();
    if (legacyBrowser) {
      updatePlaybackStatus("Old browser detected, trying…", false);
    }
  } else {
    showError();
  }
})();
</script>
</body>
</html>
